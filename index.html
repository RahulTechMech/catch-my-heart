<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Catch My Heart ❤️</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff4f91;
        --ink: #793653;
        --glass: rgba(255, 255, 255, 0.76);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Poppins, sans-serif;
      }
      body {
        color: var(--ink);
        background: linear-gradient(135deg, #ffe1ee, #e9d9ff, #ffedf5);
        background-size: 300% 300%;
        animation: bg 14s ease infinite;
        overflow-x: hidden;
      }
      body.dark {
        --ink: #fff;
        --glass: rgba(255, 255, 255, 0.12);
        background: linear-gradient(135deg, #21152e, #492646, #30204d);
        background-size: 300% 300%;
      }
      @keyframes bg {
        50% {
          background-position: 100% 100%;
        }
      }
      button {
        font:
          600 14px Poppins,
          sans-serif;
        border: 0;
        border-radius: 30px;
        padding: 11px 19px;
        background: var(--pink);
        color: white;
        cursor: pointer;
        transition:
          transform 0.2s,
          opacity 0.2s;
        touch-action: manipulation;
      }
      button:hover {
        transform: translateY(-2px);
      }
      button:focus-visible {
        outline: 3px solid #ffba52;
        outline-offset: 3px;
      }
      .toolbar {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 7px;
        z-index: 50;
      }
      .toolbar button {
        background: #ffffffd9;
        color: #a53668;
        padding: 10px;
      }
      main {
        width: min(100% - 24px, 900px);
        margin: auto;
        padding: 55px 0 24px;
        text-align: center;
      }
      h1 {
        font:
          700 clamp(45px, 7vw, 75px) "Dancing Script",
          cursive;
        color: var(--pink);
        margin: 0;
      }
      .subtitle {
        font-size: 13px;
        margin: 2px 0 12px;
      }
      .hud {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        background: var(--glass);
        border: 1px solid #ffffff7a;
        border-radius: 16px;
        padding: 9px 5px;
        box-shadow: 0 5px 15px #ad65801a;
      }
      .stat small {
        font-size: 11px;
        display: block;
        opacity: 0.75;
      }
      .stat strong {
        font-size: 23px;
        color: var(--pink);
      }
      #lives {
        white-space: nowrap;
        letter-spacing: 2px;
      }
      .game {
        position: relative;
        width: 100%;
        height: clamp(350px, 62dvh, 600px);
        overflow: hidden;
        border-radius: 25px;
        border: 3px solid #ffffffaa;
        background: linear-gradient(180deg, #fff7fd, #ffc9e1);
        box-shadow: 0 15px 45px #a94c8035;
        touch-action: none;
        user-select: none;
      }
      .dark .game {
        background: linear-gradient(#3e2b55, #784063);
      }
      .game:before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#fff 2px, transparent 3px);
        background-size: 43px 43px;
        opacity: 0.4;
        pointer-events: none;
      }
      .heart {
        position: absolute;
        top: 0;
        left: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        will-change: transform;
        line-height: 1;
        filter: drop-shadow(0 3px 3px #0002);
      }
      .basket {
        position: absolute;
        bottom: 9px;
        left: 0;
        font-size: clamp(55px, 7vw, 75px);
        line-height: 1;
        pointer-events: none;
        will-change: transform;
        filter: drop-shadow(0 5px 4px #0003);
      }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
        background: #fff9;
        backdrop-filter: blur(9px);
      }
      .dark .overlay {
        background: #1c102cbb;
      }
      .modal {
        width: min(100%, 420px);
        padding: 22px 15px;
        border-radius: 25px;
        background: var(--glass);
        box-shadow: 0 10px 40px #0001;
      }
      .modal h2 {
        font: 700 clamp(35px, 6vw, 53px) "Dancing Script";
        color: var(--pink);
        margin: 5px;
      }
      .modal p {
        font-size: 14px;
        line-height: 1.7;
      }
      .legend {
        display: flex;
        justify-content: center;
        gap: 16px;
        font-size: 13px;
        margin: 10px 0 20px;
        flex-wrap: wrap;
      }
      .controls {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 12px;
      }
      .controls button {
        padding: 10px 18px;
      }
      .pop {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        font-size: 18px;
        font-weight: 700;
        animation: floatUp 0.8s ease-out forwards;
      }
      @keyframes floatUp {
        to {
          transform: translateY(-75px);
          opacity: 0;
        }
      }
      .particle {
        position: absolute;
        pointer-events: none;
        z-index: 5;
        animation: burst 0.7s ease-out forwards;
      }
      @keyframes burst {
        to {
          transform: translate(var(--dx), var(--dy)) scale(0.3);
          opacity: 0;
        }
      }
      .footer {
        font-size: 12px;
        opacity: 0.75;
        margin: 10px;
      }
      @media (max-width: 550px) {
        main {
          padding-top: 70px;
        }
        .hud {
          gap: 5px;
        }
        .stat {
          padding: 8px 3px;
        }
        .stat strong {
          font-size: 18px;
        }
        .stat small {
          font-size: 9px;
        }
        #lives {
          letter-spacing: 0;
          font-size: 17px;
        }
        .game {
          height: clamp(370px, 66dvh, 650px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body {
          animation: none;
        }
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="music" aria-label="Toggle sound">🔊</button>
      <button id="theme" aria-label="Toggle theme">🌙</button>
      <button id="share" aria-label="Share game">💌</button>
    </div>

    <main>
      <h1>Catch My Heart ❤️</h1>
      <p class="subtitle">
        Catch the love. Avoid the darkness. Protect your hearts!
      </p>

      <div class="hud">
        <div class="stat">
          <small>SCORE</small><strong id="score">0</strong>
        </div>
        <div class="stat">
          <small>LIVES</small><strong id="lives">❤️❤️❤️</strong>
        </div>
        <div class="stat">
          <small>LEVEL</small><strong id="level">1</strong>
        </div>
        <div class="stat"><small>BEST</small><strong id="best">0</strong></div>
      </div>

      <div class="game" id="game">
        <div class="basket" id="basket">🧺</div>

        <div class="overlay" id="overlay">
          <div class="modal">
            <div style="font-size: 55px" id="modalEmoji">💖</div>
            <h2 id="modalTitle">Catch My Heart!</h2>
            <p id="modalText">
              Collect red hearts and avoid black hearts. You have only 3 lives!
            </p>
            <div class="legend">
              <span>❤️ +10</span>
              <span>🖤 -15</span>
              <span>💛 +50</span>
              <span>💔 Red miss = -1 life</span>
            </div>
            <button id="start">Start Game 💗</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="pause">⏸ Pause</button>
        <button id="restart">↻ Restart</button>
      </div>
      <p class="footer">Desktop: Mouse / ← → keys · Mobile: Drag your finger</p>
    </main>
